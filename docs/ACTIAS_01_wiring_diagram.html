<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;background:#fff}
svg{display:block}
text{font-family:Helvetica,Arial,sans-serif}
.mono{font-family:Menlo,"DejaVu Sans Mono",monospace}
.small{font-size:15px}
.lbl{font-size:13px;letter-spacing:1.5px}
</style></head><body>
<svg width="1600" height="900" viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#111"/></marker>
  </defs>
  <text fill="#111" x="60" y="70" font-size="34" font-weight="700">ACTIAS_01 — Wiring Diagram</text>
  <text x="60" y="104" class="small" fill="#555">Laptop → Arduino Uno → MG90S servo. No breadboard: the servo plugs straight into the Uno headers.</text>
  <line x1="60" y1="130" x2="1540" y2="130" stroke="#ddd"/>

  <!-- Laptop -->
  <rect x="60" y="250" width="300" height="250" rx="14" fill="#fff" stroke="#111" stroke-width="2"/>
  <text fill="#111" x="84" y="292" font-size="24" font-weight="700">MacBook</text>
  <text x="84" y="322" class="small" fill="#555">Chrome · p5.js + ml5 HandPose</text>
  <text x="84" y="348" class="small" fill="#555">Web Serial · 115200 baud</text>
  <rect x="84" y="380" width="252" height="96" rx="8" fill="#f3f3f3"/>
  <text x="100" y="408" class="lbl mono" fill="#666">SENDS</text>
  <text x="100" y="440" class="mono" font-size="15" fill="#111">'R' rest · 'G' flap</text><text x="100" y="462" class="mono" font-size="15" fill="#111">'S' fast flap</text>

  <!-- USB -->
  <line x1="360" y1="375" x2="560" y2="375" stroke="#111" stroke-width="5"/>
  <text fill="#111" x="392" y="355" class="mono" font-size="16">USB-C → USB-B</text>
  <text x="392" y="405" class="small" fill="#555">data + 5 V power</text>

  <!-- Arduino -->
  <rect x="560" y="200" width="420" height="420" rx="14" fill="#0b4f6c" />
  <text x="590" y="244" font-size="26" font-weight="700" fill="#fff">Arduino Uno</text>
  <text x="590" y="272" font-size="15" fill="#cfe3ec">butterfly_servo.ino · Servo library</text>
  <rect x="560" y="355" width="22" height="40" fill="#bbb"/>
  <text x="596" y="381" font-size="14" fill="#cfe3ec">USB</text>
  <!-- power header -->
  <g font-family="Menlo,DejaVu Sans Mono,monospace" font-size="16" fill="#fff">
    <rect x="900" y="320" width="60" height="44" rx="4" fill="#222"/><text x="886" y="348" text-anchor="end" fill="#fff">5V</text>
    <rect x="900" y="400" width="60" height="44" rx="4" fill="#222"/><text x="886" y="428" text-anchor="end" fill="#fff">GND</text>
    <rect x="900" y="480" width="60" height="44" rx="4" fill="#222"/><text x="886" y="508" text-anchor="end" fill="#fff">D9 ~PWM</text>
  </g>
  <circle cx="930" cy="342" r="7" fill="#d9d9d9"/><circle cx="930" cy="422" r="7" fill="#d9d9d9"/><circle cx="930" cy="502" r="7" fill="#d9d9d9"/>

  <!-- wires -->
  <path d="M930 342 H1180 V400 H1240" fill="none" stroke="#d62828" stroke-width="6" stroke-linejoin="round"/>
  <path d="M930 422 H1240" fill="none" stroke="#6b3e1f" stroke-width="6"/>
  <path d="M930 502 H1180 V444 H1240" fill="none" stroke="#f08a24" stroke-width="6" stroke-linejoin="round"/>
  <text x="1010" y="330" font-size="15" fill="#d62828" font-weight="700">red · +5 V</text>
  <text x="1010" y="412" font-size="15" fill="#6b3e1f" font-weight="700">brown · GND</text>
  <text x="1010" y="530" font-size="15" fill="#c46a12" font-weight="700">orange · signal</text>

  <!-- servo -->
  <rect x="1240" y="300" width="300" height="240" rx="14" fill="#fff" stroke="#111" stroke-width="2"/>
  <rect x="1240" y="380" width="26" height="84" fill="#333"/>
  <text fill="#111" x="1290" y="342" font-size="24" font-weight="700">MG90S servo</text>
  <text x="1290" y="372" class="small" fill="#555">metal gear · 180°</text>
  <text fill="#111" x="1290" y="420" class="mono" font-size="15">swing 60°–120°</text>
  <text fill="#111" x="1290" y="446" class="mono" font-size="15">rest 90°</text>
  <text x="1290" y="490" class="small" fill="#555">horn → 2 pushrods → wings</text>

  <!-- signal note -->
  <rect x="560" y="680" width="980" height="150" rx="12" fill="#f6f6f6"/>
  <text x="590" y="716" class="lbl mono" fill="#666">HOW THE SIGNAL WORKS</text>
  <text fill="#111" x="590" y="752" font-size="17">D9 sends a pulse every 20 ms (50 Hz). Pulse length sets the angle: ~1.0 ms ≈ 0°, ~1.5 ms ≈ 90°, ~2.0 ms ≈ 180°.</text>
  <text fill="#111" x="590" y="782" font-size="17">The sketch moves 1° per step (6 ms/step normal, 2 ms/step fast), and reads Serial between steps.</text>
  <text fill="#111" x="590" y="812" font-size="17">Power: the servo runs from the Uno's 5 V over USB — all grounds are shared.</text>

  <rect x="60" y="680" width="440" height="150" rx="12" fill="#fff" stroke="#ccc"/>
  <text x="84" y="716" class="lbl mono" fill="#666">PIN MAP</text>
  <text fill="#111" x="84" y="752" class="mono" font-size="16">brown  → GND</text>
  <text fill="#111" x="84" y="782" class="mono" font-size="16">red    → 5V</text>
  <text fill="#111" x="84" y="812" class="mono" font-size="16">orange → D9</text>
</svg></body></html>
